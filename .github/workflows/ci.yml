name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: allo
          POSTGRES_PASSWORD: allo
          POSTGRES_DB: allo_services
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allo -d allo_services"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://allo:allo@localhost:5432/allo_services?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run build:shared
      - run: npm run db:generate
      - run: npm run db:push -w @allo/api
      - run: npm run build:api
      - run: npm run build:web
      - run: npm run lint
